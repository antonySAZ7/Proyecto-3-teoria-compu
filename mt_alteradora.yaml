# Invierte una cadena sobre {a, b} en las mismas celdas que ocupaba la entrada.
# Invariante: X (a) e Y (b) marcan los extremos que ya tienen su valor final.
# P marca el extremo izquierdo del segmento pendiente durante un intercambio.
mt:
  states: [qElegir, qBuscarA, qBuscarB, qCambiarA, qCambiarB, qVolverA, qVolverB, qInicio, qLimpiar, qf]
  input_alphabet: [a, b]
  tape_alphabet: [a, b, X, Y, P, B]
  initial_state: qElegir
  accept_states: [qf]
  transitions:
    # Reservar el extremo izquierdo y recordar en el estado si era a o b.
    - {state: qElegir, read: [a], write: [P], move: R, next: qBuscarA}
    - {state: qElegir, read: [b], write: [P], move: R, next: qBuscarB}
    # Una marca significa que los extremos ya se encontraron; B admite ε.
    - {state: qElegir, read: [X], write: [X], move: L, next: qInicio}
    - {state: qElegir, read: [Y], write: [Y], move: L, next: qInicio}
    - {state: qElegir, read: [B], write: [B], move: R, next: qf}

    # Ir al extremo derecho del segmento pendiente, delimitado por una marca o B.
    - {state: qBuscarA, read: [a], write: [a], move: R, next: qBuscarA}
    - {state: qBuscarA, read: [b], write: [b], move: R, next: qBuscarA}
    - {state: qBuscarA, read: [X], write: [X], move: L, next: qCambiarA}
    - {state: qBuscarA, read: [Y], write: [Y], move: L, next: qCambiarA}
    - {state: qBuscarA, read: [B], write: [B], move: L, next: qCambiarA}
    - {state: qBuscarB, read: [a], write: [a], move: R, next: qBuscarB}
    - {state: qBuscarB, read: [b], write: [b], move: R, next: qBuscarB}
    - {state: qBuscarB, read: [X], write: [X], move: L, next: qCambiarB}
    - {state: qBuscarB, read: [Y], write: [Y], move: L, next: qCambiarB}
    - {state: qBuscarB, read: [B], write: [B], move: L, next: qCambiarB}

    # Escribir el valor izquierdo en el extremo derecho y recordar el valor desplazado.
    - {state: qCambiarA, read: [a], write: [X], move: L, next: qVolverA}
    - {state: qCambiarA, read: [b], write: [X], move: L, next: qVolverB}
    - {state: qCambiarB, read: [a], write: [Y], move: L, next: qVolverA}
    - {state: qCambiarB, read: [b], write: [Y], move: L, next: qVolverB}
    # Si ambos extremos son P, es el centro de una entrada impar. Se restaura.
    - {state: qCambiarA, read: [P], write: [a], move: L, next: qInicio}
    - {state: qCambiarB, read: [P], write: [b], move: L, next: qInicio}

    # Volver a P, escribir el valor derecho y pasar al siguiente par.
    - {state: qVolverA, read: [a], write: [a], move: L, next: qVolverA}
    - {state: qVolverA, read: [b], write: [b], move: L, next: qVolverA}
    - {state: qVolverA, read: [P], write: [X], move: R, next: qElegir}
    - {state: qVolverB, read: [a], write: [a], move: L, next: qVolverB}
    - {state: qVolverB, read: [b], write: [b], move: L, next: qVolverB}
    - {state: qVolverB, read: [P], write: [Y], move: R, next: qElegir}

    # Regresar al blanco izquierdo y restaurar los símbolos definitivos.
    - {state: qInicio, read: [X], write: [X], move: L, next: qInicio}
    - {state: qInicio, read: [Y], write: [Y], move: L, next: qInicio}
    - {state: qInicio, read: [B], write: [B], move: R, next: qLimpiar}
    - {state: qLimpiar, read: [X], write: [a], move: R, next: qLimpiar}
    - {state: qLimpiar, read: [Y], write: [b], move: R, next: qLimpiar}
    - {state: qLimpiar, read: [a], write: [a], move: R, next: qLimpiar}
    - {state: qLimpiar, read: [b], write: [b], move: R, next: qLimpiar}
    - {state: qLimpiar, read: [B], write: [B], move: L, next: qf}

# Los cuatro casos tienen longitud >= 5, cubren longitudes pares e impares
# y muestran un cambio visible en la cinta.
inputs:
  - "aabbb"    # bbbaa
  - "aabba"    # abbaa
  - "aaabb"    # bbaaa
  - "ababba"   # abbaba
